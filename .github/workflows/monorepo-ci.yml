name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.filter.outputs.org }}
      customer: ${{ steps.filter.outputs.customer }}
      supabase_security: ${{ steps.filter.outputs.supabase_security }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            org:
              - 'apps/org.aveyo.com/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/monorepo-ci.yml'
            customer:
              - 'apps/customer.aveyo.com/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/monorepo-ci.yml'
            supabase_security:
              - 'apps/app.aveyo.com/supabase/**'
              - 'apps/org.aveyo.com/supabase/**'
              - 'apps/app.aveyo.com/scripts/supabase/**'
              - 'apps/org.aveyo.com/scripts/run-sql-authz-check.sh'
              - 'apps/org.aveyo.com/tests/authz/**'
              - 'apps/org.aveyo.com/authz-regression-matrix.json'
              - '.github/workflows/monorepo-ci.yml'

  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder values allow build-time config modules to initialize in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  org-authz-tests:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.org == 'true' || needs.changes.outputs.supabase_security == 'true'
    runs-on: ubuntu-latest
    env:
      # Test-only placeholders so auth modules can initialize in CI.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run org authz app tests
        run: pnpm --filter org-aveyo-com run test

  org-sql-authz-tests:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.org == 'true' || needs.changes.outputs.supabase_security == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGCONNECT_TIMEOUT: 10
      REQUIRE_DATABASE_URL: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQL authz checks
        run: pnpm --filter org-aveyo-com run test:sql-authz

  supabase-migration-drift:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.supabase_security == 'true'
    runs-on: ubuntu-latest
    env:
      STRICT_MIGRATION_DRIFT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce canonical migration source
        run: pnpm --filter app-aveyo-com run supabase:migrations:check-source

  customer-quality:
    needs:
      - changes
      - verify
    if: needs.changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    env:
      # Placeholder values allow build-time config modules to initialize in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint customer app
        run: pnpm --filter customer-aveyo-com run lint

      - name: Typecheck customer app
        run: pnpm --filter customer-aveyo-com run typecheck

      - name: Build customer app
        run: pnpm --filter customer-aveyo-com run build
